[project]
name = "dokayuki"
version = "0.1.0"
description = "dokayuki (ドカ雪): week 3-4 Hokkaido snow outlook from PBC-calibrated circulation indices"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "xarray>=2024.10",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "zarr>=3.0",
    "netcdf4>=1.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "requests>=2.32",
    "jsonschema>=4.23",
    "fsspec>=2024.10",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
fetch = ["gcsfs>=2024.10", "cdsapi>=0.7.4", "ecmwf-datastores-client>=0.3", "cfgrib>=0.9.14", "eccodes>=2.38", "eccodeslib>=2.38"]
maps = ["cartopy>=0.24"]
dev = ["pytest>=8.3", "pytest-timeout>=2.3", "playwright>=1.48", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dokayuki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E741", "E731", "E701", "E702"]
